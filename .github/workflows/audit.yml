name: Audit tooling (not a Switch game build)
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  audit-tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Test ELF inspection
        run: python3 -m unittest discover -s tests -v
      - name: Build upstream translation tools
        run: make -C vendor/ia32rtools/tools -j2
